server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-v3-docs
          uri: http://auth-service:8084
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
          order: -1

        - id: admin-v3-docs
          uri: http://admin-service:8083
          predicates:
            - Path=/admin/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
          order: -1

        - id: alumno-v3-docs
          uri: http://alumno-service:8081
          predicates:
            - Path=/alumnos/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
          order: -1

        - id: curso-v3-docs
          uri: http://curso-service:8082
          predicates:
            - Path=/cursos/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
          order: -1

        - id: auth-service
          uri: http://auth-service:8084
          predicates:
            - Path=/auth/**
          order: 10

        - id: admin-service
          uri: http://admin-service:8083
          predicates:
            - Path=/auth-admin/**, /admin/**
          order: 10

        - id: alumno-service
          uri: http://alumno-service:8081
          predicates:
            - Path=/alumnos/**
          order: 10

        - id: curso-service
          uri: http://curso-service:8082
          predicates:
            - Path=/cursos/**
          order: 10

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "1. Autenticación (auth-service)"
        url: "/auth/v3/api-docs"
      - name: "2. Administración (admin-service)"
        url: "/admin/v3/api-docs"
      - name: "3. Alumnos (alumno-service)"
        url: "/alumnos/v3/api-docs"
      - name: "4. Cursos (curso-service)"
        url: "/cursos/v3/api-docs"
