server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-config-source: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: admin-auth-route
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**

        - id: admin-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/admin/**

        - id: alumno-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/alumnos/**

        - id: curso-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/cursos/**
