server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: admin-service
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/admin/**

        - id: alumno-service
          uri: lb://ALUMNO-SERVICE
          predicates:
            - Path=/alumnos/**

        - id: curso-service
          uri: lb://CURSO-SERVICE
          predicates:
            - Path=/cursos/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
